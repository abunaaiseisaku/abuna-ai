
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あぶな〜AI!</title>

<style>
/* ======================================
   1. 基本デザイン
====================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 28px 16px 40px;
    background:
        radial-gradient(ellipse at top, #172b49 0%, transparent 55%),
        #080e19;
    color: #eaf2ff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    text-align: center;
    letter-spacing: 0.3px;
}

h2 {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 1.5px;
    margin: 12px 0 28px;
    color: #ffffff;
    text-shadow: 0 0 22px rgba(0, 174, 255, 0.3);
}

h3 {
    font-size: 16px;
    font-weight: 700;
    color: #c9dcf5;
    margin: 0 0 18px;
    text-align: left;
}

/* ======================================
   2. ステータス
====================================== */

#status {
    max-width: 640px;
    margin: 0 auto 24px;
    padding: 16px 18px;
    background: #123b35;
    border: 1px solid rgba(70, 255, 190, 0.2);
    border-radius: 12px;
    color: #8affcf;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

/* ======================================
   3. 入力欄
====================================== */

input {
    width: 100%;
    max-width: 640px;
    padding: 14px 16px;
    margin: 6px auto 12px;
    display: inline-block;
    background: #111d2e;
    border: 1px solid #293e59;
    border-radius: 10px;
    color: #ffffff;
    font-size: 15px;
    outline: none;
    transition: 0.2s;
}

input:focus {
    border-color: #36aaff;
    box-shadow: 0 0 0 3px rgba(54, 170, 255, 0.13);
}

input[type="file"] {
    cursor: pointer;
}

/* ======================================
   4. ボタン
====================================== */

button {
    padding: 13px 23px;
    margin: 6px 4px;
    border: 1px solid rgba(91, 177, 255, 0.25);
    border-radius: 10px;
    background: linear-gradient(135deg, #087df0, #0755bd);
    color: white;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(0, 112, 255, 0.18);
    transition:
        transform 0.2s,
        box-shadow 0.2s,
        filter 0.2s;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0, 130, 255, 0.35);
    filter: brightness(1.15);
}

button:active:not(:disabled) {
    transform: scale(0.97);
}

button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
}

#loadButton {
    background: linear-gradient(135deg, #167eea, #0752a8);
}

#connectButton {
    background: linear-gradient(135deg, #087df0, #0755bd);
}

#startButton {
    background: linear-gradient(135deg, #00b98b, #008d70);
    border-color: rgba(0, 255, 190, 0.2);
    box-shadow: 0 5px 16px rgba(0, 210, 150, 0.15);
}

#startButton:hover:not(:disabled) {
    box-shadow: 0 8px 22px rgba(0, 210, 150, 0.3);
}

#stopButton {
    background: linear-gradient(135deg, #e44e5b, #b9253d);
    border-color: rgba(255, 100, 120, 0.2);
    box-shadow: 0 5px 16px rgba(230, 50, 80, 0.15);
}

/* ======================================
   5. モデル情報
====================================== */

#modelInfo {
    color: #8da8c8;
    font-size: 13px;
    margin: 12px 0 26px;
}

.info {
    color: #7f98b8;
    font-size: 12px;
}

/* ======================================
   6. 区切り線
====================================== */

hr {
    max-width: 640px;
    height: 1px;
    margin: 30px auto;
    border: none;
    background: linear-gradient(
        90deg,
        transparent,
        #29435f,
        transparent
    );
}

/* ======================================
   7. カメラ画面
====================================== */

#videoArea {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 22px auto;
    overflow: hidden;
    background: #030812;
    border: 1px solid #294b70;
    border-radius: 16px;
    box-shadow:
        0 0 0 4px rgba(40, 130, 220, 0.05),
        0 12px 35px rgba(0, 0, 0, 0.4);
}

#stream {
    width: 100%;
    display: block;
    border: none;
    border-radius: 15px;
}

#canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* ======================================
   8. AI情報表示
====================================== */

#fps,
#count {
    display: inline-block;
    min-width: 145px;
    margin: 10px 5px;
    padding: 16px 20px;
    background: linear-gradient(145deg, #14253b, #0d192a);
    border: 1px solid #29415e;
    border-radius: 12px;
    color: #68c7ff;
    font-size: 15px;
    font-weight: 800;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

#count {
    color: #64edb5;
}

/* ======================================
   9. エラー表示
====================================== */

#error {
    max-width: 640px;
    margin: 16px auto;
    padding: 12px;
    color: #ff8b99;
    font-size: 13px;
    line-height: 1.7;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: rgba(130, 30, 50, 0.12);
    border-radius: 8px;
}

/* ======================================
   10. スマートフォン対応
====================================== */

@media (max-width: 600px) {

    body {
        padding: 20px 12px 30px;
    }

    h2 {
        font-size: 23px;
        margin-bottom: 22px;
    }

    h3 {
        font-size: 15px;
    }

    button {
        padding: 13px 17px;
        font-size: 13px;
    }

    #fps,
    #count {
        min-width: 125px;
        padding: 14px 12px;
        font-size: 13px;
    }

    #videoArea {
        border-radius: 12px;
    }

}
</style>

<!-- ONNX Runtime Web 1.20.1 -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>

</head>

<body>

<h2>あぶな〜AI!</h2>

<div id="status">モデルを選択してください</div>

<h3>① ONNXモデル</h3>

<input type="file" id="modelFile" accept=".onnx">

<br>

<button id="loadButton">モデル読み込み</button>

<p class="info" id="modelInfo">モデル未読み込み</p>

<hr>

<h3>② カメラ接続</h3>

<input
    type="text"
    id="ipInput"
    value="http://192.168.4.1"
>

<br>

<button id="connectButton">カメラ接続</button>

<div id="videoArea">
    <img id="stream" alt="カメラ映像">
    <canvas id="canvas"></canvas>
</div>

<hr>

<h3>③ AI推論</h3>

<button id="startButton" disabled>AI開始</button>
<button id="stopButton" disabled>停止</button>

<p id="fps">FPS: 0</p>
<p id="count">検出数: 0</p>

<p id="error"></p>

<script>
"use strict";

// ======================================
// 1. 設定
// ======================================

const SIZE = 640;
const CONF = 0.35;
const IOU = 0.45;

const CAMERA_TIMEOUT = 15000;

const TARGETS = {
    0: "PERSON",
    32: "BALL"
};

let session = null;
let running = false;
let busy = false;
let cameraConnected = false;
let cameraTimer = null;

const stream = document.getElementById("stream");
const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d", {
    willReadFrequently: true
});

const status = document.getElementById("status");
const error = document.getElementById("error");


// ======================================
// 2. ステータス表示
// ======================================

function setStatus(message, color = "#245c2b") {
    status.textContent = message;
    status.style.background = color;
}

function showError(message) {
    error.textContent = message;
    setStatus("エラーが発生しました", "#8e2424");
    console.error(message);
}

function clearError() {
    error.textContent = "";
}


// ======================================
// 3. ONNX Runtime確認
// ======================================

function checkONNX() {

    if (!window.ort) {
        throw new Error(
            "ONNX Runtime Webを読み込めません。\n" +
            "インターネット接続を確認してください。"
        );
    }

}


// ======================================
// 4. ONNXモデル読み込み
// ======================================

document.getElementById("loadButton")
.addEventListener("click", async () => {

    const file =
        document.getElementById("modelFile").files[0];

    if (!file) {
        alert("yolo11s.onnxを選択してください");
        return;
    }

    const button = document.getElementById("loadButton");

    try {

        button.disabled = true;

        setStatus("モデル読み込み中...", "#755313");
        clearError();

        checkONNX();

        // 元のWASM読み込み先に復元
        ort.env.wasm.wasmPaths =
            "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";

        // シングルスレッド
        ort.env.wasm.numThreads = 1;

        const buffer = await file.arrayBuffer();

        session = await ort.InferenceSession.create(
            new Uint8Array(buffer),
            {
                executionProviders: ["wasm"],
                graphOptimizationLevel: "all"
            }
        );

        console.log("Input:", session.inputNames);
        console.log("Output:", session.outputNames);

        document.getElementById("modelInfo").textContent =
            "読み込み成功: " + file.name;

        setStatus("YOLO11s 読み込み成功！");

        updateStartButton();

    } catch (e) {

        session = null;

        document.getElementById("modelInfo").textContent =
            "モデル読み込み失敗";

        showError(
            "モデル読み込みエラー:\n" + e.message
        );

        updateStartButton();

    } finally {

        button.disabled = false;

    }

});


// ======================================
// 5. カメラ接続
// ======================================

document.getElementById("connectButton")
.addEventListener("click", () => {

    let ip =
        document.getElementById("ipInput").value.trim();

    if (!ip) {
        alert("IPアドレスを入力してください");
        return;
    }

    if (!/^https?:\/\//i.test(ip)) {
        ip = "http://" + ip;
    }

    ip = ip.replace(/\/+$/, "") + "/";

    clearTimeout(cameraTimer);

    running = false;
    cameraConnected = false;

    document.getElementById("stopButton").disabled = true;

    updateStartButton();

    clearError();

    setStatus("カメラ接続中...", "#755313");

    stream.onload = null;
    stream.onerror = null;

    stream.removeAttribute("src");

    // CORS設定
    stream.crossOrigin = "anonymous";

    const cameraURL = ip + "?t=" + Date.now();

    stream.onload = () => {

        clearTimeout(cameraTimer);

        if (stream.naturalWidth <= 0) {
            showError("カメラ画像のサイズを取得できません。");
            return;
        }

        cameraConnected = true;

        canvas.width = stream.naturalWidth;
        canvas.height = stream.naturalHeight;

        clearError();

        setStatus(
            "カメラ映像受信成功！ " +
            canvas.width + " × " + canvas.height
        );

        updateStartButton();

        console.log(
            "Camera connected:",
            canvas.width,
            canvas.height
        );

    };

    stream.onerror = () => {

        clearTimeout(cameraTimer);

        cameraConnected = false;

        updateStartButton();

        showError(
            "カメラ接続に失敗しました。\n\n" +
            "確認事項:\n" +
            "1. XIAOのWi-Fiに接続しているか\n" +
            "2. IPアドレスが192.168.4.1か\n" +
            "3. Safariでhttp://192.168.4.1/が開けるか\n" +
            "4. HTTPSからHTTPへの接続が制限されていないか"
        );

    };

    cameraTimer = setTimeout(() => {

        if (!cameraConnected) {

            cameraConnected = false;

            updateStartButton();

            showError(
                "カメラ接続がタイムアウトしました。\n\n" +
                "XIAOの電源とWi-Fi接続を確認してください。"
            );

        }

    }, CAMERA_TIMEOUT);

    stream.src = cameraURL;

});


// ======================================
// 6. 開始ボタン制御
// ======================================

function updateStartButton() {

    document.getElementById("startButton").disabled =
        !(session && cameraConnected);

}


// ======================================
// 7. 画像前処理
// ======================================

function preprocess(image) {

    const w = image.naturalWidth;
    const h = image.naturalHeight;

    const scale = Math.min(
        SIZE / w,
        SIZE / h
    );

    const nw = Math.round(w * scale);
    const nh = Math.round(h * scale);

    const px = Math.floor((SIZE - nw) / 2);
    const py = Math.floor((SIZE - nh) / 2);

    const temp = document.createElement("canvas");

    temp.width = SIZE;
    temp.height = SIZE;

    const tctx = temp.getContext("2d", {
        willReadFrequently: true
    });

    tctx.fillStyle = "rgb(114,114,114)";
    tctx.fillRect(0, 0, SIZE, SIZE);

    tctx.drawImage(
        image,
        px, py, nw, nh
    );

    const pixels = tctx.getImageData(
        0, 0, SIZE, SIZE
    ).data;

    const plane = SIZE * SIZE;

    const data = new Float32Array(
        3 * plane
    );

    for (let i = 0; i < plane; i++) {

        data[i] = pixels[i * 4] / 255;

        data[plane + i] =
            pixels[i * 4 + 1] / 255;

        data[plane * 2 + i] =
            pixels[i * 4 + 2] / 255;

    }

    return {
        tensor: new ort.Tensor(
            "float32",
            data,
            [1, 3, SIZE, SIZE]
        ),
        scale,
        px,
        py
    };

}


// ======================================
// 8. IoU
// ======================================

function calculateIoU(a, b) {

    const x1 = Math.max(a.x1, b.x1);
    const y1 = Math.max(a.y1, b.y1);

    const x2 = Math.min(a.x2, b.x2);
    const y2 = Math.min(a.y2, b.y2);

    const iw = Math.max(0, x2 - x1);
    const ih = Math.max(0, y2 - y1);

    const intersection = iw * ih;

    const areaA =
        (a.x2 - a.x1) * (a.y2 - a.y1);

    const areaB =
        (b.x2 - b.x1) * (b.y2 - b.y1);

    return intersection /
        (areaA + areaB - intersection + 1e-9);

}


// ======================================
// 9. NMS
// ======================================

function applyNMS(detections) {

    const result = [];

    for (const classId of [0, 32]) {

        let list = detections
            .filter(d => d.classId === classId)
            .sort((a, b) => b.score - a.score);

        while (list.length > 0) {

            const best = list.shift();

            result.push(best);

            list = list.filter(d =>
                calculateIoU(best, d) <= IOU
            );

        }

    }

    return result;

}


// ======================================
// 10. YOLO出力解析
// ======================================

function decode(output, prep, imageW, imageH) {

    const dims = output.dims;
    const data = output.data;

    let channels;
    let count;
    let channelFirst;

    if (dims.length !== 3 || dims[0] !== 1) {
        throw new Error(
            "想定外の出力形状: " + JSON.stringify(dims)
        );
    }

    if (dims[1] === 84) {

        channels = 84;
        count = dims[2];
        channelFirst = true;

    } else if (dims[2] === 84) {

        channels = 84;
        count = dims[1];
        channelFirst = false;

    } else {

        throw new Error(
            "YOLO出力が84チャンネルではありません: " +
            JSON.stringify(dims)
        );

    }

    function value(i, c) {

        return channelFirst
            ? data[c * count + i]
            : data[i * channels + c];

    }

    const detections = [];

    for (let i = 0; i < count; i++) {

        let bestClass = -1;
        let bestScore = 0;

        for (let c = 4; c < 84; c++) {

            const score = value(i, c);

            if (score > bestScore) {
                bestScore = score;
                bestClass = c - 4;
            }

        }

        if (!(bestClass in TARGETS)) continue;
        if (bestScore < CONF) continue;

        const cx = value(i, 0);
        const cy = value(i, 1);
        const w = value(i, 2);
        const h = value(i, 3);

        let x1 =
            (cx - w / 2 - prep.px) / prep.scale;

        let y1 =
            (cy - h / 2 - prep.py) / prep.scale;

        let x2 =
            (cx + w / 2 - prep.px) / prep.scale;

        let y2 =
            (cy + h / 2 - prep.py) / prep.scale;

        x1 = Math.max(0, Math.min(imageW, x1));
        y1 = Math.max(0, Math.min(imageH, y1));
        x2 = Math.max(0, Math.min(imageW, x2));
        y2 = Math.max(0, Math.min(imageH, y2));

        if (x2 <= x1 || y2 <= y1) continue;

        detections.push({
            x1, y1, x2, y2,
            score: bestScore,
            classId: bestClass
        });

    }

    return applyNMS(detections);

}


// ======================================
// 11. 検出枠表示
// ======================================

function drawDetections(detections) {

    ctx.clearRect(
        0, 0,
        canvas.width,
        canvas.height
    );

    ctx.lineWidth = Math.max(
        2,
        canvas.width / 320
    );

    ctx.font = "18px sans-serif";

    for (const d of detections) {

        const color =
            d.classId === 0 ? "#00e676" : "#ffca28";

        ctx.strokeStyle = color;
        ctx.fillStyle = color;

        ctx.strokeRect(
            d.x1,
            d.y1,
            d.x2 - d.x1,
            d.y2 - d.y1
        );

        ctx.fillText(
            TARGETS[d.classId] +
            " " +
            (d.score * 100).toFixed(0) + "%",
            d.x1 + 4,
            Math.max(20, d.y1 - 5)
        );

    }

}


// ======================================
// 12. 推論ループ
// ======================================

let lastTime = performance.now();
let frameCount = 0;

async function inferenceLoop() {

    if (!running) return;

    if (!busy) {

        busy = true;

        try {

            if (!cameraConnected || !stream.naturalWidth) {
                throw new Error("カメラ映像がありません。");
            }

            const prep = preprocess(stream);

            const results = await session.run({

                [session.inputNames[0]]:
                    prep.tensor

            });

            const output =
                results[session.outputNames[0]];

            const detections = decode(
                output,
                prep,
                stream.naturalWidth,
                stream.naturalHeight
            );

            drawDetections(detections);

            frameCount++;

            const now = performance.now();

            if (now - lastTime >= 1000) {

                document.getElementById("fps").textContent =
                    "FPS: " +
                    (frameCount * 1000 / (now - lastTime))
                    .toFixed(1);

                document.getElementById("count").textContent =
                    "検出数: " + detections.length;

                frameCount = 0;
                lastTime = now;

            }

        } catch (e) {

            running = false;

            showError(
                "推論エラー:\n" + e.message
            );

            document.getElementById("stopButton").disabled = true;

            updateStartButton();

        } finally {

            busy = false;

        }

    }

    if (running) {
        requestAnimationFrame(inferenceLoop);
    }

}


// ======================================
// 13. AI開始
// ======================================

document.getElementById("startButton")
.addEventListener("click", () => {

    if (!session || !cameraConnected) return;

    running = true;

    document.getElementById("startButton").disabled = true;
    document.getElementById("stopButton").disabled = false;

    clearError();

    setStatus("YOLO11s 推論中...");

    lastTime = performance.now();
    frameCount = 0;

    requestAnimationFrame(inferenceLoop);

});


// ======================================
// 14. AI停止
// ======================================

document.getElementById("stopButton")
.addEventListener("click", () => {

    running = false;

    document.getElementById("startButton").disabled = false;
    document.getElementById("stopButton").disabled = true;

    ctx.clearRect(
        0, 0,
        canvas.width,
        canvas.height
    );

    setStatus("AI停止中", "#755313");

});

</script>
</body>
</html>
